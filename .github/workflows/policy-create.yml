name: Create Policies Terraform

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Policies Deployment
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up Terraform
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.6  # Use your required version

    # Step 3: Configure AWS credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET }}
        aws-region: us-east-1  # Adjust region if needed

    # Step 4: Initialize Terraform in the 'policies' directory
    - name: Initialize Terraform in Policies Directory
      run: terraform init -reconfigure
      working-directory: policies
      env:
        TF_VAR_access_key: ${{ secrets.AWS_KEY }}
        TF_VAR_secret_key: ${{ secrets.AWS_SECRET }}

    # Step 5: Apply Terraform in the 'policies' directory
    - name: Apply Terraform in Policies Directory
      run: terraform apply -auto-approve
      working-directory: policies
      env:
        TF_VAR_access_key: ${{ secrets.AWS_KEY }}
        TF_VAR_secret_key: ${{ secrets.AWS_SECRET }}

    # Step 6: Initialize Terraform in the 'thing' directory
    - name: Initialize Terraform in Thing Directory
      run: terraform init -reconfigure
      working-directory: thing
      env:
        TF_VAR_access_key: ${{ secrets.AWS_KEY }}
        TF_VAR_secret_key: ${{ secrets.AWS_SECRET }}

    # Step 7: Apply Terraform in the 'thing' directory
    - name: Apply Terraform in Thing Directory
      run: terraform apply -auto-approve
      working-directory: thing
      env:
        TF_VAR_access_key: ${{ secrets.AWS_KEY }}
        TF_VAR_secret_key: ${{ secrets.AWS_SECRET }}
