name: Create EC2 Instance with Terraform

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main

jobs:
  terraform:
    name: Terraform EC2 Deployment
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up Terraform
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.6  # Change to your required version

    # Step 3: Configure AWS credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET }}
        aws-region: us-east-1  # Change this to your preferred AWS region

    # Step 4: Initialize Terraform with remote backend
    - name: Terraform Init
      run: terraform init
      env:
        TF_VAR_access_key: ${{ secrets.AWS_KEY }}
        TF_VAR_secret_key: ${{ secrets.AWS_SECRET }}

    # Step 5: Apply Terraform to create EC2 instance
    - name: Terraform Apply
      run: terraform apply -auto-approve
      env:
        TF_VAR_access_key: ${{ secrets.AWS_KEY }}
        TF_VAR_secret_key: ${{ secrets.AWS_SECRET }}
