name: Create IoT Thing with Terraform

on:
  workflow_dispatch:  # Allows manual trigger
  push:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Thing Deployment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.6  # Specify your required version

      # Step 3: Configure AWS credentials using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-east-1  # Update if using a different AWS region

      # Step 4: Change Directory to Terraform
      - name: Change Directory to Terraform
        run: cd thing

      # Optional: Clean up Terraform lockfile if needed
      # - name: Clean Terraform lockfile
      #   run: rm -rf .terraform/ .terraform.lock.hcl
      #   working-directory: thing

      # Step 5: Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: thing

      # Step 6: Apply Terraform configuration to create the IoT Thing and certificate
      - name: Terraform Apply
        id: terraform_apply  # Set an ID to reference this step later
        run: terraform apply -auto-approve
        working-directory: thing

      # Step 7: Retrieve and store private key and certificate from AWS Secrets Manager (optional)
      - name: Retrieve Secrets from AWS Secrets Manager
        id: get_secrets
        run: |
          echo "PRIVATE_KEY=$(aws secretsmanager get-secret-value --secret-id iot-private-key --query SecretString --output text)" >> $GITHUB_ENV
          echo "CERTIFICATE=$(aws secretsmanager get-secret-value --secret-id iot-certificate --query SecretString --output text)" >> $GITHUB_ENV

      # Step 8: Store private key as an artifact (optional)
      - name: Store private key as artifact
        run: echo "$PRIVATE_KEY" > private_key.pem

      - name: Upload private key as artifact
        uses: actions/upload-artifact@v3
        with:
          name: iot-private-key
          path: private_key.pem

      # Optional: Store certificate as an artifact (if needed)
      - name: Store certificate as artifact
        run: echo "$CERTIFICATE" > certificate.pem

      - name: Upload certificate as artifact
        uses: actions/upload-artifact@v3
        with:
          name: iot-certificate
          path: certificate.pem
