name: Destroy AWS Thing with Terraform

on:
  workflow_dispatch: # Allows manual trigger of the destroy workflow

jobs:
  terraform:
    name: Terraform Thing Destroy
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up Terraform
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.6  # Specify the required version

    # Step 3: Configure AWS credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET }}
        aws-region: us-east-1  # Specify the correct region

    # Step 4: Initialize Terraform
    - name: Terraform Init
      run: terraform init

    # Step 5: Terraform Destroy
    - name: Terraform Destroy
      run: terraform destroy -auto-approve
      env:
        TF_VAR_access_key: ${{ secrets.AWS_KEY }}
        TF_VAR_secret_key: ${{ secrets.AWS_SECRET }}
